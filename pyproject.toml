[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "security-scan"
version = "0.1.0"
description = "Java project code security scanning — plaintext passwords, hardcoded secrets, weak credentials"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
ast = [
    "tree-sitter>=0.20",
    "javalang>=1.3",
]
ai = [
    "openai>=1.0",
]
report = [
    "jinja2>=3.0",
]
encoding = [
    "chardet>=5.0",
]
all = [
    "security-scan[ast,ai,report,encoding]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
]

[project.scripts]
security-scan = "security_scan.cli.main:main"

[tool.setuptools.packages.find]
include = ["security_scan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
EOF
echo "pyproject.toml created."